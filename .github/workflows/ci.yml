name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    name: Documentation and recipe tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install test dependencies
        working-directory: tests
        run: npm ci --ignore-scripts
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run checks
        working-directory: tests
        run: npm test -- --workers=2
      - name: Check publication scope
        shell: bash
        run: |
          unexpected="$(git ls-files | grep -E '(^lab/|(^|/)(node_modules|test-results|playwright-report)/|(^|/)\.env($|\.))' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected published files:\n%s\n' "$unexpected"
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan commit history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'
